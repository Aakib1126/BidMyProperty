<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Properties</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f5f5f5; color: #333; margin: 0; padding: 0; }
        header { background: #2c3e50; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 24px; }
        nav a { color: white; text-decoration: none; font-size: 16px; padding: 10px 15px; background: #3498db; border-radius: 5px; transition: 0.3s; }
        nav a:hover { background: #2980b9; }
        section { max-width: 1200px; margin: 30px auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        .property-list { display: flex; overflow-x: auto; gap: 20px; padding-bottom: 10px; }
        .property { background: #ffffff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); text-align: center; transition: transform 0.3s; min-width: 300px; }
        .property:hover { transform: translateY(-5px); }
        .property img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; }
        .property h3 a { text-decoration: none; color: #2c3e50; font-size: 20px; }
        .property h3 a:hover { color: #3498db; }
        .property p { font-size: 16px; color: #666; margin: 5px 0; }
        .property strong { color: #2c3e50; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>All Properties</h1>
        <nav id="navContainer"></nav>
    </header>

    <section>
        <h2>Property Listings</h2>
        <div class="property-list" id="propertyList">Loading properties...</div>
    </section>

    <script src="../js/api.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/view_properties.js"></script>
</body>
</html>
