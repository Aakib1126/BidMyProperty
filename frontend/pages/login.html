<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: white; display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0;
        }
        .container {
            background: rgba(0, 0, 0, 0.85); padding: 40px; border-radius: 12px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.4); width: 380px; text-align: center;
            display: flex; flex-direction: column; align-items: center;
        }
        h1 { margin-bottom: 20px; color: #00c6ff; font-size: 26px; }
        input {
            width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #00c6ff; border-radius: 6px;
            background: rgba(255, 255, 255, 0.2); color: white; font-size: 16px; text-align: center;
        }
        input::placeholder { color: #ddd; }
        button {
            width: 95%; padding: 14px; border: none; border-radius: 6px; background: #00c6ff;
            color: white; font-size: 18px; cursor: pointer; font-weight: bold;
        }
        button:hover { background: #0072ff; }
        .link { margin-top: 15px; }
        a { color: #00c6ff; text-decoration: none; }
        a:hover { color: #ffffff; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <form id="loginForm">
            <h1>Login</h1>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
            <p><a href="forgot_password.html">Forgot Password?</a></p>
            <p>Don't have an account? <a href="register.html">Register here</a></p>
            <p>Admin? <a href="admin_login.html">Login here</a></p>
            <p>Home page <a href="index.html">Home</a></p>
        </form>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
