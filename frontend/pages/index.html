<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage - Bid on Properties</title>
    <style>
        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.8); padding: 15px 40px; font-size: 22px; font-weight: bold; height: 80px; }
        .project-name { font-size: 30px; font-weight: bold; color: #00c6ff; }
        nav { display: flex; gap: 20px; }
        nav a { color: white; text-decoration: none; font-size: 18px; padding: 12px 20px; background: #007bff; border-radius: 8px; transition: 0.3s; }
        nav a:hover { background: #0056b3; }
        .main-content { flex: 1; display: flex; flex-direction: row; align-items: center; justify-content: flex-end; text-align: left; padding: 50px; background-size: cover; background-position: center; transition: background 1s ease-in-out; }
        .search-box { background: rgba(255, 255, 255, 0.2); padding: 30px; border-radius: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
        .search-box input, .search-box select { padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; width: 250px; background: #fff; color: #333; }
        .search-box input[type="number"], .search-box select { width: 200px; }
        button { padding: 15px 25px; font-size: 18px; border: none; border-radius: 8px; background: #00c6ff; color: white; cursor: pointer; transition: 0.3s; align-self:center; }
        button:hover { background: #0072ff; }
        footer { background: rgba(0, 0, 0, 0.9); color: white; text-align: center; padding: 20px; height: 50px; }
    </style>
</head>
<body>
    <header>
        <div class="project-name">BidMyProperty</div>
        <nav id="navContainer"></nav>
    </header>

    <div class="main-content">
        <div>
            <h2>Find Your Perfect Property</h2>
            <p>Bid on the best properties in the market..!</p>
            <div class="search-box">
                <input type="text" placeholder="Enter City">
                <h3>Select Property Type</h3>
                <select>
                    <option>Property Type</option>
                    <option>Residential</option>
                    <option>Commercial</option>
                    <option>Agricultural</option>
                </select>
                <input type="number" placeholder="Budget">
                <button>Search</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 BidMyProperty. All Rights Reserved.</p>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/index.js"></script>
</body>
</html>
