<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f8; color: #333; line-height: 1.6; padding: 0 20px; }
        header { background-color: #2c3e50; color: #fff; padding: 20px; margin-bottom: 30px; text-align: center; }
        header h1 { margin-bottom: 10px; }
        nav a { color: #ecf0f1; margin: 0 15px; text-decoration: none; font-weight: 500; }
        nav a:hover { color: #1abc9c; }
        section { background: #ffffff; padding: 25px 30px; border-radius: 10px; margin-bottom: 30px; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07); }
        section h2 { margin-bottom: 15px; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        table th, table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e2e2; }
        table th { background-color: #ecf0f1; font-weight: 600; color: #2c3e50; }
        table tr:hover { background-color: #f9f9f9; }
    </style>
</head>
<body>
    <header>
        <h1>User Dashboard</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="#" id="logoutLink">Logout</a>
        </nav>
    </header>

    <section>
        <h2>Profile Management</h2>
        <p><strong>Name:</strong> <span id="userName"></span></p>
        <p><strong>Email:</strong> <span id="userEmail"></span></p>
    </section>

    <section>
        <h2>Bid History & Status</h2>
        <table>
            <tr><th>Property</th><th>Bid Amount</th><th>Time</th><th>Status</th></tr>
            <tbody id="bidHistoryBody"></tbody>
        </table>
    </section>

    <section>
        <h2>Property Watchlist</h2>
        <table>
            <tr><th>Property</th><th>Current Price</th></tr>
            <tbody id="watchlistBody"></tbody>
        </table>
    </section>

    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
