<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Details</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background: #f0f2f5; color: #333; }
        header { background: #2c3e50; padding: 15px 30px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; }
        header nav a { color: #fff; margin-left: 15px; text-decoration: none; font-weight: 500; }
        section { max-width: 1200px; margin: 40px auto; background: white; border-radius: 10px; box-shadow: 0 0 15px rgba(0, 0, 0, 0.1); display: flex; padding: 30px; gap: 30px; flex-wrap: wrap; }
        .property-images, .property-videos { flex: 1 1 45%; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .property-images img, .property-videos video { max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 5px 12px rgba(0, 0, 0, 0.15); }
        .property-details { flex: 1 1 45%; }
        .property-details h2 { color: #2c3e50; margin-top: 0; }
        .property-details p { font-size: 16px; margin: 10px 0; }
        form { margin-top: 20px; }
        form input[type="number"] { padding: 10px; width: 50%; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
        form button { padding: 10px 20px; background-color: #27ae60; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        form button:hover { background-color: #219150; }
    </style>
</head>
<body>
    <header>
        <h1>Property Details</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="view_properties.html">Back to Listings</a>
            <span id="navContainer"></span>
        </nav>
    </header>
    <section id="propertyContent">Loading...</section>

    <script src="../js/api.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/property_details.js"></script>
</body>
</html>
