<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Approval</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif;}
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border: 1px solid #ccc; }
        header{ background:#343a40; padding:30px 20px; text-align:center;}
        header h1{color:#fff; margin-bottom:20px; font-size:40px;}
        nav{display:flex; justify-content:center; gap:15px; flex-wrap:wrap;}
        nav a{text-decoration:none; color:#fff;background:#0d6efd; padding:10px 18px; border-radius:5px; transition:.3s;}
        nav a:hover{background:#0b5ed7;}
        a.button, button.button { padding: 6px 12px; text-decoration: none; background-color: #28a745; color: white; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; }
        button.delete { background-color: #dc3545; }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="admin_dashboard.html">Dashboard</a>
            <a href="admin_users.html">Manage Users</a>
            <a href="admin_reports.html">View Reports</a>
            <a href="admin_settings.html">Settings</a>
            <a href="#" id="logoutLink">Logout</a>
        </nav>
    </header><br><br>
    <div align="center"><h1>Pending Property Approvals</h1></div><br><br>
    <table>
        <tr><th>Title</th><th>Owner</th><th>Price</th><th>Action</th></tr>
        <tbody id="pendingBody"></tbody>
    </table>
    <script src="../js/api.js"></script>
    <script src="../js/admin_logout_helper.js"></script>
    <script src="../js/admin_properties.js"></script>
</body>
</html>
