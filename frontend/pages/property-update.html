<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Properties</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <h2>Update Property</h2>
    <form id="propertyUpdateForm" enctype="multipart/form-data">
        <input type="text" name="title" placeholder="Property Title" required>
        <textarea name="description" placeholder="Property Description" required></textarea>
        <input type="number" name="price" placeholder="Price" required>
        <select name="status" required>
            <option value="available">Available</option>
            <option value="sold">Sold</option>
            <option value="pending">Pending</option>
        </select>
        <input type="file" name="image" accept="image/*" required>
        <input type="file" name="document" accept=".pdf,.docx" required>
        <button type="submit">Add Property</button>
    </form>
    <script src="../js/api.js"></script>
    <script src="../js/property-update.js"></script>
</body>
</html>
